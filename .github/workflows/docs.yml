name: Deploy docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            en/pnpm-lock.yaml
            fa/pnpm-lock.yaml

      - name: Build EN
        working-directory: en
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build FA
        working-directory: fa
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assemble site
        run: |
          test -f en/xshop/.vitepress/dist/index.html
          test -f fa/xshop/.vitepress/dist/index.html
          mkdir -p _site/fa
          cp -r en/xshop/.vitepress/dist/. _site/
          cp -r fa/xshop/.vitepress/dist/. _site/fa/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
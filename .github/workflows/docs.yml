name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # برای lastUpdated

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            en/xshop/package-lock.json
            fa/xshop/package-lock.json

      - name: Build EN
        working-directory: en/xshop
        run: |
          npm ci
          npm run docs:build

      - name: Build FA
        working-directory: fa/xshop
        run: |
          npm ci
          npm run docs:build

      - name: Assemble site
        run: |
          mkdir -p _site/fa
          cp -r en/xshop/docs/.vitepress/dist/. _site/
          cp -r fa/xshop/docs/.vitepress/dist/. _site/fa/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4